BB_CONF_FRAGMENT_SUMMARY = "Run the OpenJDK runtime tests and ptests in qemu after the image is built."
BB_CONF_FRAGMENT_DESCRIPTION = "Enables ptest and testimage, and boots the image in qemu \
after it is built. testimage logs in as root over ssh, so this also enables root login \
with an empty password, like the core/yocto/root-login-with-empty-password fragment. \
For testing only, never ship an image built with this fragment. \
"

DISTRO_FEATURES:append = " ptest"
IMAGE_CLASSES += "testimage"
TESTIMAGE_AUTO = "1"
TEST_RUNQEMUPARAMS = "slirp"
QB_MEM = "-m 2048"
EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
